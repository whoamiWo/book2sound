name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install build twine --index-url https://pypi.org/simple
      - run: python -m build
      - run: twine check dist/*
      - name: Verify tag == pyproject version == wheel __version__
        shell: python
        run: |
          import glob
          import os
          import re
          import sys
          import tomllib
          import zipfile

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag.removeprefix("v")
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          if version != expected:
              sys.exit(f"tag {tag} does not match pyproject version {version}")
          (wheel,) = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as zf:
              (init,) = (n for n in zf.namelist() if n.endswith("soundbook/__init__.py"))
              code = zf.read(init).decode()
          match = re.search(r'__version__ = "([^"]+)"', code)
          if match is None or match.group(1) != expected:
              sys.exit(f"wheel __version__ {match and match.group(1)} != tag {expected}")
          print(f"version check OK: {expected}")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
